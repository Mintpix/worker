name: blog

on:
  repository_dispatch:
    types: [blog]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  actions: write

concurrency:
  group: blog-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.BLOG_VAULT_REPO }}
          token: ${{ secrets.SOURCE_PAT }}
          ref: worker
          path: ops
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.BLOG_VAULT_REPO }}
          token: ${{ secrets.SOURCE_PAT }}
          ref: master
          path: vault
          fetch-depth: 1
      - name: Cache Firefly
        uses: actions/cache@v6
        with:
          path: ops/.firefly
          key: firefly-${{ hashFiles('ops/overlay/**') }}
          restore-keys: firefly-
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and deploy
        working-directory: ops
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          VAULT_DIR: ../vault
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash worker.sh
